{% extends "base.html" %}

{% block title %}Todo List - My Django App{% endblock %}

{% block content %}
  <h1>Todo List</h1>
  <ul>
    {% for todo in todos %}
      <li>{{ todo.title }} - {% if todo.completed %}Done{% else %}Pending{% endif %}</li>
    {% empty %}
      <li>No todos available.</li>
    {% endfor %}
  </ul>
{% endblock %}
